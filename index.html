<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exemplo de Login</title>
<body>
    <h1>Exemplo de Login</h1>
    <p> Login estatico</p>
    <div id="input_group">
        <label>"Username"</label>
        <input type="text" id="user" placeholder="Digite seu nome de usuario">
        <label>"Password"</label>
        <input type="password" id="passwd" placeholder="Digite sua senha">
        <button id="verify" class="btn"></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
