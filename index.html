<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal SENAC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="page">

        <div class="bg-circle circle-one"></div>
        <div class="bg-circle circle-two"></div>
        <div class="bg-circle circle-three"></div>

        <section class="login-card">

            <div class="top-line"></div>

            <div class="logo-area">

                <div class="logo-box">
                    <img
                        id="senacLogo"
                        alt="Logo SENAC"
                        class="senac-logo"
                    >
                </div>

                <div class="portal-info">
                    <span>Portal Educacional</span>
                    <small>Ambiente de acesso</small>
                </div>

            </div>


            <div class="screen-container">

                <!-- ESCOLHA DE PERFIL -->
                <section id="roleScreen" class="screen active">

                    <div class="header">

                        <span class="eyebrow">
                            BEM-VINDO
                        </span>

                        <h1>
                            Acesse o portal
                        </h1>

                        <p>
                            Escolha seu perfil para continuar.
                        </p>

                    </div>


                    <div class="role-options">

                        <button
                            class="role-card"
                            onclick="selecionarTipo('estudante')"
                        >

                            <div class="role-icon">

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="27"
                                    height="27"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="m4 6 8-4 8 4-8 4Z"/>
                                    <path d="m18 10 2 1v5"/>
                                    <path d="M6 8v5c0 2 2.7 4 6 4s6-2 6-4V8"/>
                                </svg>

                            </div>


                            <div class="role-text">

                                <strong>
                                    Sou estudante
                                </strong>

                                <span>
                                    Acessar área do aluno
                                </span>

                            </div>


                            <div class="role-arrow">
                                →
                            </div>

                        </button>


                        <button
                            class="role-card"
                            onclick="selecionarTipo('professor')"
                        >

                            <div class="role-icon professor">

                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="27"
                                    height="27"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <circle cx="12" cy="7" r="4"/>
                                    <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
                                </svg>

                            </div>


                            <div class="role-text">

                                <strong>
                                    Sou professor
                                </strong>

                                <span>
                                    Acessar área do docente
                                </span>

                            </div>


                            <div class="role-arrow">
                                →
                            </div>

                        </button>

                    </div>

                </section>


                <!-- LOGIN -->
                <section id="loginScreen" class="screen">

                    <button
                        class="back-button"
                        onclick="voltar()"
                        type="button"
                    >
                        <span>←</span>
                        Voltar
                    </button>


                    <div class="header">

                        <span
                            class="profile-badge"
                            id="profileBadge"
                        >
                            Estudante
                        </span>

                        <h1 id="tituloLogin">
                            Login do estudante
                        </h1>

                        <p>
                            Digite seus dados para acessar.
                        </p>

                    </div>


                    <form id="loginForm">

                        <div class="input-group">

                            <label for="user">
                                Usuário
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">

                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="20"
                                        height="20"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <circle cx="12" cy="8" r="4"/>
                                        <path d="M4 21a8 8 0 0 1 16 0"/>
                                    </svg>

                                </span>

                                <input
                                    type="text"
                                    id="user"
                                    placeholder="Digite seu usuário"
                                    autocomplete="username"
                                >

                            </div>

                        </div>


                        <div class="input-group">

                            <label for="passwd">
                                Senha
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">

                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="20"
                                        height="20"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <rect
                                            x="4"
                                            y="10"
                                            width="16"
                                            height="11"
                                            rx="2"
                                        />

                                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                                    </svg>

                                </span>

                                <input
                                    type="password"
                                    id="passwd"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                >


                                <button
                                    class="password-button"
                                    type="button"
                                    onclick="mostrarSenha()"
                                >

                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="20"
                                        height="20"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path
                                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"
                                        />

                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="3"
                                        />
                                    </svg>

                                </button>

                            </div>

                        </div>


                        <div
                            id="mensagem"
                            class="message"
                        ></div>


                        <button
                            class="login-button"
                            type="submit"
                        >

                            <span>
                                Entrar
                            </span>

                            <span class="login-arrow">
                                →
                            </span>

                        </button>

                    </form>

                </section>

            </div>


            <footer>

                <span>
                    SENAC
                </span>

                <div class="footer-dot"></div>

                <span>
                    Portal Educacional
                </span>

            </footer>

        </section>

    </main>

    <script src="js.js"></script>

</body>
</html>
